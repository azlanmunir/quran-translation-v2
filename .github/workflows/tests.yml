name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: brew install ffmpeg rubberband
      - run: python -m pip install -r requirements-dev.txt -r requirements-urdu-video.txt
      - run: python -m ruff check src scripts --select F
      - run: python -m pytest -q
